<title>Lookbook</title>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --ink:#1b1b1a; --muted:#5e5d59; --line:#dddbd5;
  --accent:#1f5eff; --accent-ink:#ffffff; --ok:#1d7a46; --focus:#1f5eff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --surface:#1e1e1c; --ink:#ecebe6; --muted:#a3a29c; --line:#34332f;
  --accent:#7aa2ff; --accent-ink:#0d1220; --ok:#5cc98a; --focus:#7aa2ff; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1e1e1c; --ink:#ecebe6; --muted:#a3a29c; --line:#34332f;
  --accent:#7aa2ff; --accent-ink:#0d1220; --ok:#5cc98a; --focus:#7aa2ff; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1600px;margin:0 auto}
header{padding-block:28px 16px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line)}
h1{font-size:1.6rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.controls label{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
select,textarea,button{font:inherit;color:inherit}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.grid{display:grid;gap:20px;padding-block:20px;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card[hidden]{display:none!important}
.card-head{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:14px 16px 10px}
.card-head h2{font-size:1.05rem;margin:0}
.card-head p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.icon-btn:hover{border-color:var(--ink)}
.stage{position:relative;overflow:hidden;border-block:1px solid var(--line);background:#fff}
.stage iframe{border:0;display:block;transform-origin:0 0;background:#fff}
.rate{padding:12px 16px 16px;display:grid;gap:10px}
.stars{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stars span{font-size:.85rem;color:var(--muted);margin-right:4px}
.stars button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600}
.stars button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
textarea{width:100%;min-height:64px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.feedback{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
@media (max-width:820px){.feedback{grid-template-columns:1fr}}
.copy.float{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.feedback h2{font-size:1rem;margin:0 0 6px}
.json-box{display:grid;gap:8px}
pre{margin:0;max-height:220px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.copy{justify-self:start;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:1rem;cursor:pointer}
.copy.done{background:var(--ok)}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.focus-layer{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.focus-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.focus-bar strong{font-size:1rem}
.focus-layer iframe{flex:1;border:0;width:100%;background:#fff}
</style>

<!-- CONFIG: the skill fills this in -->
<script>
var LOOKBOOK = {
  subject: "Example subject",
  version: "v1",
  spec: "One-line summary of the shared content spec every variant follows."
};
</script>

<!-- VARIANTS: one <template class="variant"> per style. Replace these demo variants. -->
<template class="variant" data-style="Swiss Design" data-note="Strict grid, sans-serif, asymmetric clarity.">
  <style>body{margin:0;font:16px/1.5 Helvetica,Arial,sans-serif;color:#111;background:#fff}.g{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;padding:40px}h1{grid-column:1/9;font-size:56px;line-height:1;margin:0;letter-spacing:-.03em}.n{grid-column:10/13;font-size:96px;font-weight:700;color:#e30613;line-height:.8}p{grid-column:1/7}</style>
  <div class="g"><h1>Same content, Swiss.</h1><div class="n">01</div><p>Demo variant. The skill replaces this with the real build.</p></div>
</template>
<template class="variant" data-style="Neo-Brutalism" data-note="Thick borders, hard shadows, loud flat color.">
  <style>body{margin:0;font:16px/1.5 Arial,sans-serif;background:#fff36b;color:#000;padding:40px}.c{border:3px solid #000;box-shadow:8px 8px 0 #000;background:#fff;padding:24px;max-width:520px}h1{margin:0 0 8px;font-size:44px}button{border:3px solid #000;background:#ff6ad5;font-weight:700;padding:10px 18px;box-shadow:4px 4px 0 #000}</style>
  <div class="c"><h1>Same content, brutal.</h1><p>Demo variant. The skill replaces this with the real build.</p><button>Action</button></div>
</template>

<div class="wrap">
  <header>
    <div>
      <h1 id="title">Lookbook</h1>
      <p class="sub" id="spec"></p>
    </div>
    <div class="controls">
      <label>Columns <select id="cols"><option>1</option><option selected>2</option><option>3</option></select></label>
      <label>Render as <select id="vp"><option value="fit">Fit card</option><option value="1280" selected>Desktop 1280</option><option value="390">Phone 390</option></select></label>
      <label>Height <select id="ht"><option value="420">Short</option><option value="640" selected>Normal</option><option value="900">Tall</option></select></label>
      <label>Show <select id="show"><option value="all">All styles</option></select></label>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <section class="feedback" aria-label="Feedback">
    <div>
      <h2>Overall notes</h2>
      <textarea id="overall" placeholder="What you want next: mix styles, keep this from one, drop that…"></textarea>
      <p class="hint">Ratings and comments save in this browser as you type.</p>
    </div>
    <div class="json-box">
      <h2>Feedback for your AI</h2>
      <pre id="json"></pre>
      <button class="copy" id="copy" type="button">Copy feedback</button>
      <p class="hint" id="copyhint">Paste it into any AI chat to direct the next version.</p>
    </div>
  </section>
</div>

<button class="copy float" id="copy-float" type="button">Copy feedback</button>

<div class="focus-layer" id="focus" hidden>
  <div class="focus-bar"><strong id="focus-name"></strong><button class="icon-btn" id="focus-close" type="button">Close (Esc)</button></div>
  <iframe id="focus-frame" title="Focused style"></iframe>
</div>

<script>
(function(){
  var KEY = "lookbook:" + LOOKBOOK.subject + ":" + LOOKBOOK.version;
  var state = {ratings:{}, comments:{}, overall:""};
  try { var saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved) state = saved; } catch(e){}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

  document.getElementById("title").textContent = "Lookbook: " + LOOKBOOK.subject;
  document.getElementById("spec").textContent = LOOKBOOK.spec;
  document.title = "Lookbook: " + LOOKBOOK.subject;

  var variants = Array.prototype.slice.call(document.querySelectorAll("template.variant")).map(function(t){
    return {name:t.dataset.style, note:t.dataset.note || "", html:"<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>" + t.innerHTML};
  });

  var grid = document.getElementById("grid"), show = document.getElementById("show");
  var cards = [];

  variants.forEach(function(v){
    var opt = document.createElement("option"); opt.value = v.name; opt.textContent = v.name; show.appendChild(opt);

    var card = document.createElement("article"); card.className = "card"; card.dataset.style = v.name;
    card.innerHTML =
      '<div class="card-head"><div><h2></h2><p></p></div><button class="icon-btn" type="button">Full screen</button></div>' +
      '<div class="stage"><iframe loading="lazy"></iframe></div>' +
      '<div class="rate"><div class="stars" role="group"><span>Rating</span></div><textarea placeholder="What works, what doesn\'t"></textarea></div>';
    card.querySelector("h2").textContent = v.name;
    card.querySelector(".card-head p").textContent = v.note;
    var frame = card.querySelector("iframe"); frame.title = v.name + " preview"; frame.srcdoc = v.html;
    card.querySelector(".icon-btn").addEventListener("click", function(){ openFocus(v); });

    var stars = card.querySelector(".stars"); stars.setAttribute("aria-label", "Rate " + v.name);
    for (var i = 1; i <= 5; i++) (function(n){
      var b = document.createElement("button"); b.type = "button"; b.textContent = n;
      b.setAttribute("aria-label", n + " of 5");
      b.setAttribute("aria-pressed", state.ratings[v.name] === n ? "true" : "false");
      b.addEventListener("click", function(){
        state.ratings[v.name] = state.ratings[v.name] === n ? null : n;
        Array.prototype.forEach.call(stars.querySelectorAll("button"), function(x, idx){ x.setAttribute("aria-pressed", state.ratings[v.name] === idx + 1 ? "true" : "false"); });
        update();
      });
      stars.appendChild(b);
    })(i);

    var ta = card.querySelector("textarea"); ta.setAttribute("aria-label", "Comment on " + v.name);
    ta.value = state.comments[v.name] || "";
    ta.addEventListener("input", function(){ state.comments[v.name] = ta.value; update(); });

    grid.appendChild(card); cards.push({card:card, frame:frame});
  });

  var overall = document.getElementById("overall");
  overall.value = state.overall || "";
  overall.addEventListener("input", function(){ state.overall = overall.value; update(); });

  function layout(){
    var vp = document.getElementById("vp").value, ht = +document.getElementById("ht").value;
    cards.forEach(function(c){
      var stage = c.frame.parentElement, w = stage.clientWidth || 600;
      if (vp === "fit") { c.frame.style.width = "100%"; c.frame.style.height = ht + "px"; c.frame.style.transform = "none"; stage.style.height = ht + "px"; }
      else {
        var vw = +vp, s = Math.min(1, w / vw);
        c.frame.style.width = vw + "px"; c.frame.style.height = (ht / s) + "px"; c.frame.style.transform = "scale(" + s + ")";
        stage.style.height = ht + "px";
        if (s === 1) c.frame.style.marginInline = "auto"; else c.frame.style.marginInline = "0";
      }
    });
  }
  ["cols","vp","ht"].forEach(function(id){ document.getElementById(id).addEventListener("change", function(){
    grid.style.setProperty("--cols", document.getElementById("cols").value); layout(); }); });
  show.addEventListener("change", function(){
    cards.forEach(function(c){ c.card.hidden = show.value !== "all" && c.card.dataset.style !== show.value; }); layout(); });
  if (window.ResizeObserver) new ResizeObserver(layout).observe(grid); else window.addEventListener("resize", layout);

  function payload(){
    var styles = variants.map(function(v){ return {style:v.name, rating:state.ratings[v.name] || null, comment:(state.comments[v.name] || "").trim()}; });
    var ranking = styles.filter(function(s){ return s.rating; }).sort(function(a,b){ return b.rating - a.rating; }).map(function(s){ return s.style; });
    return {
      lookbook: LOOKBOOK.subject, version: LOOKBOOK.version, date: (function(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); })(new Date()),
      ranking: ranking, styles: styles, overall: (state.overall || "").trim(),
      for_your_ai: "Ratings 1-5, higher is better; unrated = null. Use top-rated styles and comments to direct the next version."
    };
  }
  var pre = document.getElementById("json");
  var floatBtn = document.getElementById("copy-float");
  function floatLabel(){ var n = variants.filter(function(v){ return state.ratings[v.name]; }).length; return "Copy feedback (" + n + "/" + variants.length + " rated)"; }
  function update(){ pre.textContent = JSON.stringify(payload(), null, 2); if (!floatBtn.classList.contains("done")) floatBtn.textContent = floatLabel(); save(); }

  var copyBtn = document.getElementById("copy"), hint = document.getElementById("copyhint");
  function doCopy(btn, label){
    var text = pre.textContent;
    function done(){ btn.textContent = "Copied ✓"; btn.classList.add("done"); setTimeout(function(){ btn.classList.remove("done"); btn.textContent = label(); }, 2000); }
    function fallback(){
      var r = document.createRange(); r.selectNodeContents(pre); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      var ok = false; try { ok = document.execCommand("copy"); } catch(e){}
      if (ok) done(); else hint.textContent = "Text selected. Press Ctrl+C (Cmd+C on Mac) to copy.";
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }
  copyBtn.addEventListener("click", function(){ doCopy(copyBtn, function(){ return "Copy feedback"; }); });
  floatBtn.addEventListener("click", function(){ doCopy(floatBtn, floatLabel); });

  var focus = document.getElementById("focus"), ff = document.getElementById("focus-frame");
  function openFocus(v){ document.getElementById("focus-name").textContent = v.name; ff.srcdoc = v.html; focus.hidden = false; document.getElementById("focus-close").focus(); }
  function closeFocus(){ focus.hidden = true; ff.srcdoc = ""; }
  document.getElementById("focus-close").addEventListener("click", closeFocus);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !focus.hidden) closeFocus(); });

  if (window.innerWidth < 820) document.getElementById("vp").value = "fit";
  grid.style.setProperty("--cols", "2"); layout(); update();
})();
</script>
